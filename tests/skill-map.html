<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Skill map responsive check</title>
<style>body{font:15px system-ui;margin:20px;background:#e5e8e0;color:#153b2f}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,select{font:inherit;padding:10px}iframe{display:block;border:1px solid #657b68;background:#f4f3ec;height:844px;max-width:none}pre{white-space:pre-wrap}#frame-wrap{overflow:auto;max-width:100%}</style></head>
<body><header><label>Viewport <select id="size"><option value="390">390 px — phone</option><option value="320">320 px — small phone</option><option value="768">768 px — tablet</option><option value="1280">1280 px — desktop</option></select></label><button id="read" type="button">Read render counters</button><button id="burst" type="button">Burst 20 zoom requests</button><button id="reload" type="button">Reload frame</button></header>
<p>Manual development fixture. Counters describe scheduled animation callbacks, not device frame rate. Native touch and low-end hardware still require device testing.</p><pre id="report" role="status">Loading…</pre><div id="frame-wrap"><iframe id="frame" title="CV website responsive preview" src="../index.html#technical" style="width:390px"></iframe></div>
<script>
const frame=document.querySelector('#frame'),report=document.querySelector('#report');let stats;
document.querySelector('#size').addEventListener('change',e=>frame.style.width=e.target.value+'px');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,raf=w.requestAnimationFrame.bind(w),cancel=w.cancelAnimationFrame.bind(w),pending=new Set();
  stats={requested:0,executed:0,cancelled:0,pending};
  w.requestAnimationFrame=callback=>{stats.requested++;let id=raf(time=>{pending.delete(id);stats.executed++;callback(time);});pending.add(id);return id;};
  w.cancelAnimationFrame=id=>{if(pending.delete(id))stats.cancelled++;cancel(id);};read();
});
function read(){const w=frame.contentWindow,d=w.document;report.textContent=JSON.stringify({viewport:w.innerWidth,documentWidth:d.documentElement.scrollWidth,nodes:d.querySelectorAll('.skill-node').length,edgeLayers:d.querySelectorAll('.skill-edges').length,graphResources:w.performance.getEntriesByType('resource').filter(e=>/skill-map.*\.js/.test(e.name)).length,requested:stats?.requested,executed:stats?.executed,cancelled:stats?.cancelled,pending:stats?.pending.size},null,2);}
document.querySelector('#read').addEventListener('click',read);
document.querySelector('#burst').addEventListener('click',()=>{const b=frame.contentDocument.querySelector('.skill-plus');for(let i=0;i<20;i++)b?.click();read();});
document.querySelector('#reload').addEventListener('click',()=>frame.contentWindow.location.reload());
</script></body></html>

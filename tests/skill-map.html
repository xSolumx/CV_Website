<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Skill map responsive check</title>
<style>body{font:15px system-ui;margin:20px;background:#e5e8e0;color:#153b2f}header{position:sticky;top:0;z-index:5;background:#e5e8e0;padding-block:10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button,select{font:inherit;padding:10px}iframe{display:block;border:1px solid #657b68;background:#f4f3ec;height:844px;max-width:none}pre{white-space:pre-wrap;max-height:220px;overflow:auto}#frame-wrap{overflow:auto;max-width:100%}</style></head>
<body><header><label>Viewport <select id="size"><option value="390">390 px — phone</option><option value="320">320 px — small phone</option><option value="768">768 px — tablet</option><option value="1280">1280 px — desktop</option></select></label><button id="read" type="button">Read render counters</button><button id="reload" type="button">Reload frame</button><button id="verify" type="button">Verify all graph interactions</button><label><input id="nojs" type="checkbox"> No JavaScript</label></header>
<p>Manual development fixture. Counters describe scheduled animation callbacks, not device frame rate. Native touch and low-end hardware still require device testing.</p><pre id="report" role="status">Loading…</pre><div id="frame-wrap"><iframe id="frame" title="CV website responsive preview" src="../index.html#technical" style="width:390px"></iframe></div>
<script>
const frame=document.querySelector('#frame'),report=document.querySelector('#report');let stats;
document.querySelector('#size').addEventListener('change',e=>frame.style.width=e.target.value+'px');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,raf=w.requestAnimationFrame.bind(w),cancel=w.cancelAnimationFrame.bind(w),pending=new Set();
  stats={requested:0,executed:0,cancelled:0,pending};
  w.requestAnimationFrame=callback=>{stats.requested++;let id=raf(time=>{pending.delete(id);stats.executed++;callback(time);});pending.add(id);return id;};
  w.cancelAnimationFrame=id=>{if(pending.delete(id))stats.cancelled++;cancel(id);};read();
});
function read(){const w=frame.contentWindow,d=w.document;report.textContent=JSON.stringify({viewport:w.innerWidth,documentWidth:d.documentElement.scrollWidth,nodes:d.querySelectorAll('.skill-node').length,edgeLayers:d.querySelectorAll('.skill-lines path').length,graphResources:w.performance.getEntriesByType('resource').filter(e=>/skill-map.*\.js/.test(e.name)).length,requested:stats?.requested,executed:stats?.executed,cancelled:stats?.cancelled,pending:stats?.pending.size},null,2);}
document.querySelector('#read').addEventListener('click',read);

document.querySelector('#reload').addEventListener('click',()=>frame.contentWindow.location.reload());
document.querySelector('#nojs').addEventListener('change',e=>{
  if(e.target.checked)frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');
  frame.contentWindow.location.reload();
});
document.querySelector('#verify').addEventListener('click',async()=>{
  const w=frame.contentWindow,d=w.document,atlas=d.querySelector('#technical-map'),failures=[];
  const delay=()=>new Promise(resolve=>setTimeout(resolve,100));
  const check=(ok,message)=>{if(!ok)failures.push(message);};
  atlas.open=true;atlas.scrollIntoView();await delay();
  for(let i=0;i<100 && !atlas.classList.contains('skill-ready');i++)await delay();
  if(!atlas.classList.contains('skill-ready')){report.textContent='Graph did not activate within 10 seconds.';return;}
  const nodes=[...d.querySelectorAll('[data-node]')];
  check(nodes.length===50 && d.querySelectorAll('.skill-origin').length===1,'Expected 51 nodes');
  check(d.querySelectorAll('.skill-lines path').length===63,'Expected 63 edges');
  check(d.querySelectorAll('[data-node]:disabled').length===0,'Graph failed to activate');
  let selections=0,jumps=0;
  for(const button of nodes){
    button.click();selections++;
    const note=d.querySelector('.skill-note:not([hidden])');
    check(note?.querySelector('strong').textContent===button.textContent,'Wrong context: '+button.dataset.node);
    check(d.querySelectorAll('[aria-pressed=true]').length===1,'Selection is not unique');
    if(w.innerWidth<=900)check(note?.previousElementSibling===(button.closest('.skill-row')||button),'Mobile note is remote: '+button.dataset.node);
    const bridge=note?.querySelector('.skill-bridge-link');
    if(bridge){const target=bridge.dataset.jump;bridge.click();jumps++;check(d.activeElement?.dataset.node===target,'Jump focus failed: '+target);check(d.querySelector('[aria-pressed=true]')?.dataset.node===target,'Jump selection failed');}
    d.querySelector('.skill-note:not([hidden]) .skill-dismiss')?.click();
    check(d.querySelectorAll('[aria-pressed=true]').length===0,'Dismiss failed');
  }
  nodes[0].click();nodes[0].dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
  check(d.querySelectorAll('[aria-pressed=true]').length===0,'Escape failed');
  atlas.scrollIntoView();await delay();
  for(const width of [320,390,768,1280]){
    frame.style.width=width+'px';await delay();
    check(d.documentElement.scrollWidth<=w.innerWidth,'Horizontal overflow at '+width);
    check(nodes.every(el=>el.scrollWidth<=el.clientWidth+1),'Clipped label at '+width);
    check(nodes.every(el=>el.getBoundingClientRect().height>=44),'Small touch target at '+width);
    check([...d.querySelectorAll('.skill-lines path')].every(el=>el.getAttribute('d')&&!/NaN|undefined/.test(el.getAttribute('d'))),'Invalid edge geometry at '+width);
  }
  frame.style.width=document.querySelector('#size').value+'px';await delay();
  const before=stats.executed;await delay();check(stats.executed===before,'Animation continues while idle');
  atlas.open=false;await delay();const closed=stats.executed;await delay();check(stats.executed===closed,'Animation continues while collapsed');
  atlas.open=true;atlas.scrollIntoView();await delay();await delay();
  check(w.performance.getEntriesByType('resource').filter(e=>/skill-map.*\.js/.test(e.name)).length===1,'Graph module loaded more than once');
  report.textContent=JSON.stringify({passed:failures.length===0,failures,selections,jumps,widths:[320,390,768,1280],nodes:51,edges:63,pending:stats.pending.size},null,2);
});
</script></body></html>
